
services:
  ssp-proxy:
    build: 
      context: ./proxy
    ports:
      - "8081:80"
    volumes:
      - ./proxy/config:/var/simplesamlphp/config
      - ./proxy/metadata:/var/simplesamlphp/metadata
      - ./proxy/modules/mymodule:/var/simplesamlphp/modules/mymodule
    networks:
      saml-net:
        aliases:
          - proxy.example.com

  ssp-sp:
    build: 
      context: ./sp
    ports:
      - "8082:80"
    volumes:
      - ./sp/config:/var/simplesamlphp/config
      - ./sp/metadata:/var/simplesamlphp/metadata
      - ./sp/modules/mymodule:/var/simplesamlphp/modules/mymodule
    networks:
      saml-net:
        aliases:
          - sp.example.com
  ssp-idp:
    build: 
      context: ./idp
    ports:
      - "8083:80"
    volumes:
      - ./idp/config:/var/simplesamlphp/config
      - ./idp/metadata:/var/simplesamlphp/metadata
      - ./idp/modules/mymodule:/var/simplesamlphp/modules/mymodule
    networks:
      saml-net:
        aliases:
          - idp.example.com

networks:
  saml-net:
    driver: bridge